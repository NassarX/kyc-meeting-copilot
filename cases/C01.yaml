  utterances:
  - utt_id: u-01
    speaker: rm
    text: 'Thank you for coming, Ms Marchetti-Okonkwo. Let me check the spelling: M-A-R-C-H-E-T-T-I, then a hyphen, O-K-O-N-K-W-O.'
  - utt_id: u-02
    speaker: client
    text: That is right. This is Dr Tomasz Wierzbicki, my accountant.
  - utt_id: u-03
    speaker: accountant
    text: Pleased to meet you. I have worked with Isabelle since the fourteenth of March, twenty nineteen.
  - utt_id: u-04
    speaker: rm
    text: Could you walk me through where your wealth comes from?
  - utt_id: u-05
    speaker: client
    text: Mostly from my company, Valdoria Holdings S.A. On the second of September, twenty twenty-two, I sold a forty percent
      stake for one point two five million Swiss francs.
  - utt_id: u-06
    speaker: rm
    text: And the rest of the company?
  - utt_id: u-07
    speaker: client
    text: I kept sixty percent. The company paid me dividends of three point four million euros, no, sorry, two point four
      million euros.
  - utt_id: u-08
    speaker: accountant
    text: It was two point four, yes.
  - utt_id: u-09
    speaker: rm
    text: Where do you hold these assets now?
  - utt_id: u-10
    speaker: client
    text: A brokerage account with seven hundred eighty thousand dollars, and a foundation in Liechtenstein, which I set up
      on the third of April, twenty twenty-one.
  - utt_id: u-11
    speaker: rm
    text: And your income today?
  - utt_id: u-12
    speaker: client
    text: Consulting. About ninety-five thousand Swiss francs a year. I moved to Luxembourg three years ago in June.
  - utt_id: u-13
    speaker: rm
    text: Any borrowing?
  - utt_id: u-14
    speaker: client
    text: A mortgage at four and a quarter percent.
  - utt_id: u-15
    speaker: rm
    text: 'Let me recap: Isabelle Marchetti-Okonkwo, and dividends of two point four million euros. Please correct me.'
