    text: Thank you. Where does your wealth come from?
  - utt_id: u-14
    speaker: client
    text: I built up a chain of dental clinics, four clinics in central Switzerland, Clínica Serrana Dental. I sold it.
  - utt_id: u-15
    speaker: rm
    text: When did that sale complete?
  - utt_id: u-16
    speaker: client
    text: In February. February twenty twenty-seven. The closing was on the twelfth.
  - utt_id: u-17
    speaker: rm
    text: And the price for your share?
  - utt_id: u-18
    speaker: client
    text: I owned all of it. It went for three, no, sorry, two point four million Swiss francs. Two point four. The three
      was the first offer.
  - utt_id: u-19
    speaker: rm
    text: Who bought it?
  - utt_id: u-20
    speaker: client
    text: A dental group from Basel, Orvana Praxisgruppe.
  - utt_id: u-21
    speaker: rm
    text: Understood. Any other assets?
  - utt_id: u-22
