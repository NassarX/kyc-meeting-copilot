  - utt_id: u-27
    speaker: rm
    text: And current income, since the sale?
  - utt_id: u-28
    speaker: client
    text: I still consult for the buyer, two days a week. One hundred and eighty thousand francs a year.
  - utt_id: u-29
    speaker: rm
    text: Any other income?
  - utt_id: u-30
    speaker: client
    text: Some dividends from the brokerage account, small. Maybe fifteen thousand a year.
  - utt_id: u-31
    speaker: rm
    text: Okay. The standard question. Do you or any family member hold a public function?
  - utt_id: u-32
    speaker: client
    text: No. My husband is a dentist too. No politics anywhere.
  - utt_id: u-33
    speaker: rm
    text: Thank you. Now, what would you like to bring into the account initially?
  - utt_id: u-34
