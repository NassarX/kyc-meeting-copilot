  - utt_id: u-37
    speaker: rm
    text: Thank you. What's the plan for the relationship with us?
  - utt_id: u-38
    speaker: client
    text: We'd move part of the Tessaro portfolio. Six million euros to start, coming from Tessaro's account in Vaduz.
  - utt_id: u-39
    speaker: accountant
    text: The account would be opened for Tessaro, with Mr. Bastien-Nakamura declared as beneficial owner.
  - utt_id: u-40
    speaker: rm
