  - utt_id: u-27
    speaker: rm
    text: When was the foundation set up?
  - utt_id: u-28
    speaker: accountant
    text: The Alvermont Foundation was established in June 2019. Tessaro was incorporated earlier, in 2014.
  - utt_id: u-29
    speaker: rm
    text: Thank you. Does the foundation hold anything besides Tessaro?
  - utt_id: u-30
    speaker: accountant
    text: An apartment in Lisbon, worth about one point nine million euros, held directly by the foundation.
  - utt_id: u-31
    speaker: rm
    text: And what assets sit in Tessaro now?
  - utt_id: u-32
    speaker: accountant
    text: Mostly cash and a bond portfolio, about eleven million euros, at a private bank in Vaduz.
  - utt_id: u-33
    speaker: rm
