    text: Thank you. Now, the source of wealth. Can you walk me through it?
  - utt_id: u-14
    speaker: client
    text: I co-founded a freight logistics company, Corvalis Freight. I held thirty-five percent. We sold the whole company
      to a private equity buyer in October 2022.
  - utt_id: u-15
    speaker: rm
    text: And your share of the sale?
  - utt_id: u-16
    speaker: client
    text: Fourteen million euros, roughly. Fourteen point one, I think.
  - utt_id: u-17
    speaker: accountant
    text: Fourteen point one million, yes, I have the completion statement here.
  - utt_id: u-18
    speaker: rm
    text: Who was the buyer?
  - utt_id: u-19
    speaker: client
    text: Marlowe Ridge Capital, a fund based in London.
  - utt_id: u-20
    speaker: rm
    text: Did the proceeds come to you personally?
  - utt_id: u-21
    speaker: accountant
    text: No. Not personally. The shares were held through Tessaro Holdings Limited, a Jersey company, so the proceeds went
      to Tessaro.
  - utt_id: u-22
    speaker: rm
    text: And who owns Tessaro Holdings?
  - utt_id: u-23
    speaker: accountant
    text: Tessaro is one hundred percent owned by the Alvermont Foundation, a Liechtenstein foundation.
  - utt_id: u-24
    speaker: rm
