  utterances:
  - utt_id: u-01
    speaker: rm
    text: Thanks for making the trip to our Monaco office, Mr. Kowalczyk-Amari. Is it all right if I go through the onboarding
      questions?
  - utt_id: u-02
    speaker: client
    text: Yes, yes, please. I have about an hour.
  - utt_id: u-03
    speaker: rm
    text: Your full name, please, as on your passport.
  - utt_id: u-04
    speaker: client
    text: Dariusz Piotr Kowalczyk-Amari.
  - utt_id: u-05
    speaker: rm
    text: And your date of birth?
  - utt_id: u-06
    speaker: client
    text: Twenty-second of November, nineteen seventy-nine.
  - utt_id: u-07
    speaker: rm
    text: Nationality?
  - utt_id: u-08
    speaker: client
    text: Polish.
  - utt_id: u-09
    speaker: rm
    text: And you live here in Monaco now?
  - utt_id: u-10
    speaker: client
    text: Yes, since September last year. We have an apartment in Fontvieille.
  - utt_id: u-11
    speaker: rm
    text: And for tax, where are you resident?
  - utt_id: u-12
    speaker: client
    text: Monaco. That was the whole point of the move, honestly.
  - utt_id: u-13
    speaker: rm
    text: Understood. Can you tell me where your wealth comes from?
  - utt_id: u-14
    speaker: client
    text: Mostly the sale of my company. I founded a software firm in Kraków, Brzozowa Analytics, data tools for logistics
      companies.
  - utt_id: u-15
    speaker: rm
    text: When did you sell it?
  - utt_id: u-16
    speaker: client
    text: The deal closed in June 2023.
  - utt_id: u-17
    speaker: rm
    text: And what did you hold before the sale?
  - utt_id: u-18
    speaker: client
    text: Sixty percent. My co-founder had the rest.
  - utt_id: u-19
    speaker: rm
    text: Who was the buyer?
  - utt_id: u-20
    speaker: client
    text: A Dutch group, Halderveen Software Partners.
  - utt_id: u-21
    speaker: rm
    text: And your share of the proceeds?
  - utt_id: u-22
    speaker: client
    text: Three point two million euros, before tax. A bit under three after.
  - utt_id: u-23
    speaker: rm
    text: Okay. And since the sale, do you have an income?
  - utt_id: u-24
    speaker: client
    text: I sit on two advisory boards. Together it's about ninety thousand euros a year.
  - utt_id: u-25
    speaker: rm
    text: Fine. Now, the question we ask everybody. Do you or any family member hold a public function? Politics, government,
      a state company, anything like that?
  - utt_id: u-26
    speaker: client
    text: No, no. Nobody in politics. We're a boring family.
  - utt_id: u-27
    speaker: rm
    text: Not a judge, a senior official, nothing of that kind?
  - utt_id: u-28
    speaker: client
    text: Well, my sister works for the government in Warsaw, but it's a, you know, a civil service thing. Not politics.
  - utt_id: u-29
    speaker: rm
    text: What does she do there, if you don't mind me asking?
  - utt_id: u-30
    speaker: client
    text: She's at the infrastructure ministry. She was in the planning department for years.
  - utt_id: u-31
    speaker: rm
    text: Is that still her role?
  - utt_id: u-32
    speaker: client
    text: Hmm. To be honest, last year she was appointed deputy minister. Deputy minister of infrastructure. I don't really
      think of it as politics, she's a technocrat.
  - utt_id: u-33
    speaker: rm
    text: Thank you, that's helpful. What's your sister's name, for the file?
  - utt_id: u-34
    speaker: client
    text: Agnieszka Kowalczyk. Kowalczyk without the Amari.
  - utt_id: u-35
    speaker: rm
    text: Okay. Let's talk about the account. What would you plan to deposit initially?
  - utt_id: u-36
    speaker: client
    text: Around two million euros, from the sale proceeds. They're with a bank in Warsaw now.
  - utt_id: u-37
    speaker: rm
    text: And ongoing flows?
  - utt_id: u-38
    speaker: client
    text: The board fees, so maybe ninety thousand a year coming in. Some going out for living costs.
  - utt_id: u-39
    speaker: rm
    text: Do you have any loans, a mortgage on the apartment?
  - utt_id: u-40
    speaker: client
    text: No, we bought it outright. Well, from the sale money.
  - utt_id: u-41
    speaker: rm
    text: Do you own any other property?
  - utt_id: u-42
    speaker: client
    text: A house near Zakopane. Holiday house, maybe worth four hundred thousand euros.
  - utt_id: u-43
    speaker: rm
    text: Okay, nearly done. I just want to go back to the tax question for my notes. Monaco as tax residence, correct?
  - utt_id: u-44
    speaker: client
    text: Ah. Actually, I should correct that. For this year I'm still filing in Poland. My adviser said the Monaco residence
      only counts for tax from January. So for now, Poland.
  - utt_id: u-45
    speaker: rm
    text: So currently your tax residence is Poland?
  - utt_id: u-46
    speaker: client
    text: Yes. Poland. Sorry for the confusion earlier.
  - utt_id: u-47
    speaker: rm
    text: No problem, that's exactly why I asked again. I'll need your Monaco residence card and a copy of the share sale
      agreement.
  - utt_id: u-48
    speaker: client
    text: I'll get those to you this week.
  - utt_id: u-49
    speaker: rm
    text: Thank you. That's everything for today.
  - utt_id: u-50
    speaker: client
    text: Thank you very much.
