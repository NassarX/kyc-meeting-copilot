    speaker: rm
    text: Good morning, thanks for coming in. Shall we start with the basics for the account opening?
  - utt_id: u-02
    speaker: client
    text: Of course. Go ahead.
  - utt_id: u-03
    speaker: rm
    text: Could you give me your full name as it appears on your passport?
  - utt_id: u-04
    speaker: client
    text: Ingrid Solveig Halvorsen-Matos. Halvorsen-Matos with a hyphen.
  - utt_id: u-05
    speaker: rm
    text: And your date of birth?
  - utt_id: u-06
    speaker: client
    text: Fourteenth of March, nineteen eighty-four.
  - utt_id: u-07
    speaker: rm
    text: What is your nationality?
  - utt_id: u-08
    speaker: client
    text: I'm Norwegian. Only Norwegian, no second passport.
  - utt_id: u-09
    speaker: rm
    text: And where do you live at the moment?
  - utt_id: u-10
    speaker: client
    text: In Luxembourg. I moved here in September 2016 for work and I've stayed.
  - utt_id: u-11
    speaker: rm
    text: Where are you resident for tax purposes?
  - utt_id: u-12
    speaker: client
    text: Luxembourg as well. I file my tax return here every year.
  - utt_id: u-13
    speaker: rm
    text: Thank you. Let's talk about where your wealth comes from. What are the main sources?
  - utt_id: u-14
    speaker: client
    text: Two things, really. My salary, and an inheritance from my grandmother.
  - utt_id: u-15
    speaker: rm
    text: Let's take the inheritance first. When was that?
  - utt_id: u-16
    speaker: client
    text: She passed away in early 2019 and the estate was settled in April 2019.
  - utt_id: u-17
    speaker: rm
    text: And roughly how much did you receive?
  - utt_id: u-18
    speaker: client
    text: One point eight million euros, after the estate taxes in Norway.
  - utt_id: u-19
    speaker: rm
    text: Who was the estate settled through?
  - utt_id: u-20
    speaker: client
    text: The executor was the family's notary in Bergen, the Lindqvist and Aamodt practice.
  - utt_id: u-21
    speaker: rm
    text: Do you still hold that money?
  - utt_id: u-22
    speaker: client
    text: Most of it. It's sitting in cash and a few bond funds at my current bank, about one point six million euros today.
  - utt_id: u-23
    speaker: rm
    text: Understood. And the salary, where do you work?
  - utt_id: u-24
    speaker: client
    text: I'm director of engineering at Veltrona Systems, here in Luxembourg. It's a private company, industrial sensors.
  - utt_id: u-25
    speaker: rm
    text: What does that pay, roughly?
  - utt_id: u-26
    speaker: client
    text: My base is two hundred and ten thousand euros a year, plus a bonus that's usually around twenty thousand.
  - utt_id: u-27
    speaker: rm
    text: Any other income? Rental, dividends, anything like that?
  - utt_id: u-28
    speaker: client
    text: No, nothing else. I don't own property apart from my flat, and there's no mortgage on it.
  - utt_id: u-29
    speaker: rm
    text: Good. Now a standard question we ask everyone. Do you, or does anyone in your close family, hold a public function?
      A politician, a senior civil servant, a judge, a senior officer at a state company?
  - utt_id: u-30
    speaker: client
    text: No. Nobody. My parents are retired teachers and my brother is a nurse.
  - utt_id: u-31
    speaker: rm
    text: And you yourself have never held a public office?
  - utt_id: u-32
    speaker: client
    text: Never.
  - utt_id: u-33
    speaker: rm
    text: Thank you. What would you plan to bring into the account to start with?
  - utt_id: u-34
    speaker: client
    text: One point two million euros. I'd move it from the inheritance money at my current bank.
  - utt_id: u-35
    speaker: rm
    text: And after that, do you expect regular flows in or out?
  - utt_id: u-36
    speaker: client
    text: I'd add from my savings, maybe sixty thousand euros a year. Not much going out.
  - utt_id: u-37
    speaker: rm
    text: That's all clear. What are you hoping we'll do with it?
  - utt_id: u-38
    speaker: client
    text: A balanced mandate. Nothing exotic. I'd like it to be there for my children's education eventually.
  - utt_id: u-39
    speaker: rm
    text: Sounds sensible. I'll ask you to send a copy of your passport and the inheritance certificate after the meeting.
  - utt_id: u-40
    speaker: client
    text: No problem, I have both scanned.
  - utt_id: u-41
    speaker: rm
    text: Perfect. I think that's everything for today. Thank you, Ms. Halvorsen-Matos.
  - utt_id: u-42
    speaker: client
    text: Thank you.
