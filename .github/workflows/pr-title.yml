name: pr-title

# main is squash-merged, so the PR title becomes the commit message: it must be a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: "Start the subject in lower case and don't end it with a full stop."
