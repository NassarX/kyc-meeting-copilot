name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: "Install (no audio extra: the local transcriber needs Apple Silicon)"
        run: uv sync --extra viewer
      - name: "Tests (fakes only: no API key, no network, no spend)"
        run: uv run pytest -q
      - name: Every case is consistent with the rules
        run: uv run kyc-eval run --pipeline gold

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --only-group dev ruff check src tests cases eval

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # the action lists the PR's commits to scan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
